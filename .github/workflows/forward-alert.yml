name: Morning breakout alert

# Watches delayed Yahoo data from 10:30 to 12:00 ET and sends one phone push.
# No broker, no orders. The script waits on the Eastern clock, so one UTC start
# time covers both summer and winter. Read-only token; actions pinned to exact
# commits and packages to exact versions.
on:
  schedule:
    - cron: "45 13 * * 1-5"   # 9:45 AM ET in summer, 8:45 AM ET in winter
  workflow_dispatch:

permissions: {}

concurrency:
  group: forward-alert
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: "3.13"
      - run: pip install --require-hashes -r requirements-forward.lock
      - name: Watch for the breakout
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -u forward_alert.py
