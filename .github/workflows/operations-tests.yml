name: Paper operations regression tests

on:
  push:
    branches: [main]
    paths: ["*.py", "requirements*.lock", ".github/workflows/operations-tests.yml"]
  pull_request:
    paths: ["*.py", "requirements*.lock", ".github/workflows/operations-tests.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: pip install --require-hashes -r requirements-paper.lock
      - run: python -m unittest -v test_operations
      - run: python variants.py --check
