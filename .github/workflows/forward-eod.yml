name: Forward log (after the close)

# Replays each finished session on delayed Yahoo data, for the base rules and each
# variant in variants.py, and commits the result.
# No broker, no orders.
#
# Two jobs on purpose: "build" installs and runs Python with a read-only token,
# "publish" holds the write token and runs no installed code. Actions are pinned
# to exact commits and packages to exact versions.
on:
  schedule:
    # Several start times on purpose: GitHub can start scheduled jobs late or skip one.
    # Starting twice is harmless (one order, one push and one log row per day).
    - cron: "30 21 * * 1-5"   # 5:30 PM ET in summer, 4:30 PM in winter
    - cron: "30 23 * * 1-5"   # backup
  workflow_dispatch:

permissions: {}

concurrency:
  group: forward-eod
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: "3.13"
      - run: pip install --require-hashes -r requirements-forward.lock
      - name: Replay finished sessions
        run: python forward_run.py
      - name: Rebuild the forward page and the variants page
        run: |
          python forward_report.py
          python variants_report.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: forward-record
          retention-days: 3
          path: |
            forward/forward_log.csv
            forward/forward_log_orb5.csv
            forward/forward_log_both60.csv
            docs/FORWARD.md
            docs/VARIANTS.md
            docs/charts/variants.png
            docs/charts/variants-dark.png
            docs/charts/forward.png
            docs/charts/forward-dark.png

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          ref: main
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4.3.0
        with:
          name: forward-record
          path: ${{ runner.temp }}/record
      # The build job is the less trusted side. Take only the expected files
      # from its output, by exact name, and check each one before it enters the repo.
      - name: Copy the expected files only
        env:
          RECORD: ${{ runner.temp }}/record
        run: |
          set -euo pipefail
          HEADER="date,config_id,bar_min,range_high,range_low,range_pct,flags,outcome,entry,stop,target,exit,pts,risk_pts,R,usd_1c,over_risk,logged_at"
          files="forward/forward_log.csv forward/forward_log_orb5.csv forward/forward_log_both60.csv
                 docs/FORWARD.md docs/VARIANTS.md docs/charts/forward.png docs/charts/forward-dark.png
                 docs/charts/variants.png docs/charts/variants-dark.png"
          for f in $files; do
            src="$RECORD/$f"
            if [ ! -e "$src" ] && [ ! -L "$src" ]; then
              continue                      # charts do not exist until the first signal
            fi
            if [ -L "$src" ] || [ ! -f "$src" ]; then
              echo "::error::$f is not a regular file"; exit 1
            fi
            if [ "$(stat -c %s "$src")" -gt 5000000 ]; then
              echo "::error::$f is larger than 5 MB"; exit 1
            fi
            case "$f" in
              forward/*.csv)
                if [ "$(head -n 1 "$src" | tr -d '\r')" != "$HEADER" ]; then
                  echo "::error::$f has an unexpected header"; exit 1
                fi ;;
            esac
            mkdir -p "$(dirname "$f")"
            cp --no-dereference "$src" "$f"
          done
      - name: Commit the record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forward/forward_log.csv forward/forward_log_orb5.csv forward/forward_log_both60.csv
          git add docs/FORWARD.md docs/VARIANTS.md
          git add docs/charts/forward.png docs/charts/forward-dark.png docs/charts/variants.png docs/charts/variants-dark.png 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "Forward log: $(TZ=America/New_York date +%F)"
            git pull --rebase
            git push
          fi
