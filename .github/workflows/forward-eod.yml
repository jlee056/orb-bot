name: Forward log (after the close)

# Replays each finished session on delayed Yahoo data and commits the result.
# No broker, no orders.
#
# Two jobs on purpose: "build" installs and runs Python with a read-only token,
# "publish" holds the write token and runs no installed code. Actions are pinned
# to exact commits and packages to exact versions.
on:
  schedule:
    - cron: "30 21 * * 1-5"   # 5:30 PM ET in summer, 4:30 PM ET in winter
  workflow_dispatch:

permissions: {}

concurrency:
  group: forward-eod
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: "3.13"
      - run: pip install -r requirements-forward.txt
      - name: Replay finished sessions
        run: python forward_run.py
      - name: Rebuild the forward page
        run: python forward_report.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: forward-record
          retention-days: 3
          path: |
            forward/forward_log.csv
            docs/FORWARD.md
            docs/charts/forward.png
            docs/charts/forward-dark.png

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4.3.0
        with:
          name: forward-record
          path: .
      - name: Commit the record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forward/forward_log.csv docs/FORWARD.md
          git add docs/charts/forward.png docs/charts/forward-dark.png 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "Forward log: $(TZ=America/New_York date +%F)"
            git push
          fi
