name: Paper trade entry (Alpaca, QQQ)

# Sends at most one bracket order per variant per day to Alpaca PAPER accounts.
# Practice money only: alpaca_io.py has no live switch.
#
# One job per variant (variants.py), each with only its own account's keys:
#   entry         base, the frozen 60-minute long-only rules (10:30 to 12:00 ET)
#   entry_orb5    first 5-minute candle, long or short at 9:35 ET
#   entry_both60  base rules plus shorts
# A job whose secrets are missing exits without doing anything.
on:
  schedule:
    # Several start times on purpose: GitHub can start scheduled jobs late or skip one.
    # Starting twice is harmless (one order, one push and one log row per day per variant).
    # orb5 has to be running before 9:35 ET, so the first three starts are before that in summer and winter.
    - cron: "15 12 * * 1-5"   # first start: 8:15 AM ET in summer, 7:15 AM in winter
    - cron: "0 13 * * 1-5"   # backup
    - cron: "20 13 * * 1-5"   # backup: 9:20 AM ET in summer, 8:20 AM in winter
    - cron: "45 13 * * 1-5"   # backup
  workflow_dispatch:

permissions: {}

concurrency:
  group: paper-entry
  cancel-in-progress: false

jobs:
  entry:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: "3.13"
      - run: pip install --require-hashes -r requirements-paper.lock
      - name: Check the frozen settings have not drifted
        run: python variants.py --check
      - name: Watch for the breakout and place the order
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -u alpaca_bot.py entry

  entry_orb5:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: "3.13"
      - run: pip install --require-hashes -r requirements-paper.lock
      - name: Check the frozen settings have not drifted
        run: python variants.py --check
      - name: Trade the first candle's direction
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_KEY_ORB5 }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_ORB5 }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -u alpaca_bot.py entry --variant orb5

  entry_both60:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: "3.13"
      - run: pip install --require-hashes -r requirements-paper.lock
      - name: Check the frozen settings have not drifted
        run: python variants.py --check
      - name: Watch for a breakout either way and place the order
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_KEY_BOTH60 }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_BOTH60 }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -u alpaca_bot.py entry --variant both60
