name: Paper trade entry (Alpaca, QQQ)

# Watches QQQ from 10:30 to 12:00 ET and sends at most one bracket order to an
# Alpaca PAPER account. Practice money only: alpaca_io.py has no live switch.
# Without the Alpaca secrets the script exits without doing anything.
on:
  schedule:
    - cron: "45 13 * * 1-5"   # 9:45 AM ET in summer, 8:45 AM ET in winter
  workflow_dispatch:

permissions: {}

concurrency:
  group: paper-entry
  cancel-in-progress: false

jobs:
  entry:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: "3.13"
      - run: pip install -r requirements-paper.txt
      - name: Watch for the breakout and place the order
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -u alpaca_bot.py entry
