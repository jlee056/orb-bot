name: Paper trade close and record (Alpaca, QQQ)

# Flattens any QQQ position 10 minutes before the close in the Alpaca PAPER
# account, records the day, and commits the record. The script sleeps until the
# right time on the Eastern clock, so a late or early start is harmless.
#
# Three jobs, so that secrets, installed code and write access never meet:
#   trade    has the Alpaca keys, read-only token, packages installed by exact
#            file hash. It uploads NO files. The only thing it hands on is one
#            line of text (the day's log row) as a job output.
#   report   no secrets, read-only token, fresh checkout. Treats that line as
#            untrusted: it is appended to the committed log and the result must
#            pass .github/scripts/validate_paper_log.sh before anything is built
#            or uploaded.
#   publish  write token, runs no installed code, copies in four named files.
#
# What this does not do: no check can stop code that already holds a key from
# sending it somewhere. The controls for that are the hash-locked packages, the
# pinned actions, and keys that only open a practice account.
on:
  schedule:
    - cron: "30 18 * * 1-5"   # 2:30 PM ET in summer, 1:30 PM ET in winter
  workflow_dispatch:

permissions: {}

concurrency:
  group: paper-close
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
    outputs:
      row: ${{ steps.emit.outputs.row }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: "3.13"
      - run: pip install --require-hashes -r requirements-paper.lock
      - name: Flatten and record the day
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -u alpaca_bot.py close
      - name: Hand on the new row (one line of text, no files)
        id: emit
        run: |
          set -euo pipefail
          old_n="$(git show HEAD:paper/alpaca_trades.csv | tr -d '\r' | awk 'END { print NR }')"
          row="$(tr -d '\r' < paper/alpaca_trades.csv | awk -v n="$old_n" 'NR == n + 1')"
          echo "row=${row}" >> "$GITHUB_OUTPUT"
          if [ -n "$row" ]; then echo "One new row handed on."; else echo "No new row today."; fi

  report:
    needs: trade
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          persist-credentials: false
      # The row came from the job that holds the keys, so it is untrusted input. It is
      # passed in through the environment (never pasted into the script) and must pass
      # the validator, run from this fresh checkout, before it is used for anything.
      - name: Validate the new row and add it to the log
        env:
          ROW: ${{ needs.trade.outputs.row }}
        run: |
          set -euo pipefail
          if [ -z "$ROW" ]; then
            echo "No new row."
            exit 0
          fi
          cp paper/alpaca_trades.csv "$RUNNER_TEMP/candidate.csv"
          printf '%s\n' "$ROW" >> "$RUNNER_TEMP/candidate.csv"
          bash .github/scripts/validate_paper_log.sh "$RUNNER_TEMP/candidate.csv" paper/alpaca_trades.csv "$RUNNER_TEMP/checked.csv"
          cp "$RUNNER_TEMP/checked.csv" paper/alpaca_trades.csv
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: "3.13"
      - run: pip install --require-hashes -r requirements-forward.lock
      - name: Rebuild the paper page
        run: python paper_report.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: paper-record
          retention-days: 3
          path: |
            paper/alpaca_trades.csv
            docs/PAPER.md
            docs/charts/paper.png
            docs/charts/paper-dark.png

  publish:
    needs: report
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4.3.0
        with:
          name: paper-record
          path: ${{ runner.temp }}/record
      # Take only the four expected files, by exact name. The log is validated again
      # here against the committed copy; the others are checked for type and size.
      - name: Copy the expected files only
        env:
          RECORD: ${{ runner.temp }}/record
        run: |
          set -euo pipefail
          for f in paper/alpaca_trades.csv docs/PAPER.md docs/charts/paper.png docs/charts/paper-dark.png; do
            src="$RECORD/$f"
            if [ ! -e "$src" ] && [ ! -L "$src" ]; then
              continue                      # charts do not exist until the first trade
            fi
            if [ -L "$src" ] || [ ! -f "$src" ]; then
              echo "::error::$f is not a regular file"; exit 1
            fi
            if [ "$(stat -c %s "$src")" -gt 5000000 ]; then
              echo "::error::$f is larger than 5 MB"; exit 1
            fi
            mkdir -p "$(dirname "$f")"
            if [ "$f" = "paper/alpaca_trades.csv" ]; then
              bash .github/scripts/validate_paper_log.sh "$src" paper/alpaca_trades.csv "$RUNNER_TEMP/checked.csv"
              cp "$RUNNER_TEMP/checked.csv" "$f"
            else
              cp --no-dereference "$src" "$f"
            fi
          done
      - name: Commit the record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/alpaca_trades.csv docs/PAPER.md
          git add docs/charts/paper.png docs/charts/paper-dark.png 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "Paper trades: $(TZ=America/New_York date +%F)"
            git pull --rebase
            git push
          fi
