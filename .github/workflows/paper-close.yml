name: Paper trade close and record (Alpaca, QQQ)

# Flattens any QQQ position 10 minutes before the close in the Alpaca PAPER
# account, records the day, and commits the record. The script sleeps until the
# right time on the Eastern clock, so a late or early start is harmless.
#
# Three jobs, so that secrets, installed code and write access never meet:
#   trade*   one per variant (variants.py), each with only its own account's
#            Alpaca keys, read-only token, packages installed by exact file hash.
#            It uploads NO files. The only thing it hands on is one line of text
#            (the day's log row) as a job output.
#   report   no secrets, read-only token, fresh checkout. Treats those lines as
#            untrusted: each is appended to its committed log and the result must
#            pass .github/scripts/validate_paper_log.sh before anything is built
#            or uploaded. Runs even if one variant's job failed.
#   publish  write token, runs no installed code, copies in named files only.
#
# What this does not do: no check can stop code that already holds a key from
# sending it somewhere. The controls for that are the hash-locked packages, the
# pinned actions, and keys that only open a practice account.
on:
  schedule:
    # Several start times on purpose: GitHub can start scheduled jobs late or skip one.
    # Starting twice is harmless (one order, one push and one log row per day).
    - cron: "0 17 * * 1-5"   # first start: 1 PM ET in summer, 12 PM in winter
    - cron: "0 18 * * 1-5"   # backup
    - cron: "0 19 * * 1-5"   # backup
  workflow_dispatch:

permissions: {}

concurrency:
  group: paper-close
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
    outputs:
      row: ${{ steps.emit.outputs.row }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: "3.13"
      - run: pip install --require-hashes -r requirements-paper.lock
      - name: Check the frozen settings have not drifted
        run: python variants.py --check
      - name: Flatten and record the day
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -u alpaca_bot.py close
      - name: Hand on the new row (one line of text, no files)
        id: emit
        run: |
          set -euo pipefail
          old_n="$(git show HEAD:paper/alpaca_trades.csv | tr -d '\r' | awk 'END { print NR }')"
          row="$(tr -d '\r' < paper/alpaca_trades.csv | awk -v n="$old_n" 'NR == n + 1')"
          echo "row=${row}" >> "$GITHUB_OUTPUT"
          if [ -n "$row" ]; then echo "One new row handed on."; else echo "No new row today."; fi

  trade_orb5:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
    outputs:
      row: ${{ steps.emit.outputs.row }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: "3.13"
      - run: pip install --require-hashes -r requirements-paper.lock
      - name: Check the frozen settings have not drifted
        run: python variants.py --check
      - name: Flatten and record the day
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_KEY_ORB5 }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_ORB5 }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -u alpaca_bot.py close --variant orb5
      - name: Hand on the new row (one line of text, no files)
        id: emit
        run: |
          set -euo pipefail
          old_n="$(git show HEAD:paper/alpaca_trades_orb5.csv | tr -d '\r' | awk 'END { print NR }')"
          row="$(tr -d '\r' < paper/alpaca_trades_orb5.csv | awk -v n="$old_n" 'NR == n + 1')"
          echo "row=${row}" >> "$GITHUB_OUTPUT"
          if [ -n "$row" ]; then echo "One new row handed on."; else echo "No new row today."; fi

  trade_both60:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
    outputs:
      row: ${{ steps.emit.outputs.row }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: "3.13"
      - run: pip install --require-hashes -r requirements-paper.lock
      - name: Check the frozen settings have not drifted
        run: python variants.py --check
      - name: Flatten and record the day
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_KEY_BOTH60 }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_BOTH60 }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -u alpaca_bot.py close --variant both60
      - name: Hand on the new row (one line of text, no files)
        id: emit
        run: |
          set -euo pipefail
          old_n="$(git show HEAD:paper/alpaca_trades_both60.csv | tr -d '\r' | awk 'END { print NR }')"
          row="$(tr -d '\r' < paper/alpaca_trades_both60.csv | awk -v n="$old_n" 'NR == n + 1')"
          echo "row=${row}" >> "$GITHUB_OUTPUT"
          if [ -n "$row" ]; then echo "One new row handed on."; else echo "No new row today."; fi

  report:
    needs: [trade, trade_orb5, trade_both60]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          ref: main
          persist-credentials: false
      # The rows came from the jobs that hold the keys, so they are untrusted input. They
      # are passed in through the environment (never pasted into the script) and must pass
      # the validator, run from this fresh checkout, before they are used for anything.
      - name: Validate the new rows and add each to its log
        env:
          ROW_BASE: ${{ needs.trade.outputs.row }}
          ROW_ORB5: ${{ needs.trade_orb5.outputs.row }}
          ROW_BOTH60: ${{ needs.trade_both60.outputs.row }}
        run: |
          set -euo pipefail
          add() {
            local row="$1" log="$2"
            if [ -z "$row" ]; then echo "No new row for $log."; return 0; fi
            cp "$log" "$RUNNER_TEMP/candidate.csv"
            printf '%s\n' "$row" >> "$RUNNER_TEMP/candidate.csv"
            bash .github/scripts/validate_paper_log.sh "$RUNNER_TEMP/candidate.csv" "$log" "$RUNNER_TEMP/checked.csv"
            cp "$RUNNER_TEMP/checked.csv" "$log"
          }
          add "$ROW_BASE" paper/alpaca_trades.csv
          add "$ROW_ORB5" paper/alpaca_trades_orb5.csv
          add "$ROW_BOTH60" paper/alpaca_trades_both60.csv
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: "3.13"
      - run: pip install --require-hashes -r requirements-forward.lock
      - name: Rebuild the paper page and the variants page
        run: |
          python paper_report.py
          python variants_report.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: paper-record
          retention-days: 3
          path: |
            paper/alpaca_trades.csv
            paper/alpaca_trades_orb5.csv
            paper/alpaca_trades_both60.csv
            docs/PAPER.md
            docs/VARIANTS.md
            docs/charts/paper.png
            docs/charts/paper-dark.png
            docs/charts/variants.png
            docs/charts/variants-dark.png

  publish:
    needs: report
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          ref: main
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4.3.0
        with:
          name: paper-record
          path: ${{ runner.temp }}/record
      # Take only the expected files, by exact name. Each log is validated again here
      # against its committed copy; the others are checked for type and size.
      - name: Copy the expected files only
        env:
          RECORD: ${{ runner.temp }}/record
        run: |
          set -euo pipefail
          files="paper/alpaca_trades.csv paper/alpaca_trades_orb5.csv paper/alpaca_trades_both60.csv
                 docs/PAPER.md docs/VARIANTS.md docs/charts/paper.png docs/charts/paper-dark.png
                 docs/charts/variants.png docs/charts/variants-dark.png"
          for f in $files; do
            src="$RECORD/$f"
            if [ ! -e "$src" ] && [ ! -L "$src" ]; then
              continue                      # charts do not exist until the first trade
            fi
            if [ -L "$src" ] || [ ! -f "$src" ]; then
              echo "::error::$f is not a regular file"; exit 1
            fi
            if [ "$(stat -c %s "$src")" -gt 5000000 ]; then
              echo "::error::$f is larger than 5 MB"; exit 1
            fi
            mkdir -p "$(dirname "$f")"
            case "$f" in
              paper/*.csv)
                bash .github/scripts/validate_paper_log.sh "$src" "$f" "$RUNNER_TEMP/checked.csv"
                cp "$RUNNER_TEMP/checked.csv" "$f" ;;
              *)
                cp --no-dereference "$src" "$f" ;;
            esac
          done
      - name: Commit the record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/alpaca_trades.csv paper/alpaca_trades_orb5.csv paper/alpaca_trades_both60.csv
          git add docs/PAPER.md docs/VARIANTS.md
          git add docs/charts/paper.png docs/charts/paper-dark.png docs/charts/variants.png docs/charts/variants-dark.png 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "Paper trades: $(TZ=America/New_York date +%F)"
            git pull --rebase
            git push
          fi
